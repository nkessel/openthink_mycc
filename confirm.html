<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Check your information</title>
    <!-- Round 4 (Nov 19): open the connection to the map's server while the page loads -->
    <link rel="preconnect" href="https://script.google.com" crossorigin />
    <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin />
    <style>
      /* Shown before the page's own CSS loads */
      body{margin:0;background:#0a0a0f;color:#e5e7eb;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      .loading{min-height:70vh;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;text-align:center;padding:0 16px}
      .spinner{width:44px;height:44px;border-radius:50%;border:4px solid #2f2f3c;border-top-color:#34d399;animation:spin 0.9s linear infinite}
      @keyframes spin{to{transform:rotate(360deg)}}
      @media (prefers-reduced-motion:reduce){.spinner{animation-duration:2.5s}}
      .loading .t{font-weight:600;font-size:1.1em}.loading .n{color:#a1a8b3;font-size:.95em;max-width:28em;min-height:1.5em}
    </style>
  </head>
  <body>
    <div id="banner" role="region" aria-label="Editing status"></div>
    <div class="wrap" id="app"><div class="loading" role="status" aria-live="polite"><div class="spinner" aria-hidden="true"></div><div class="t">Loading your group’s page…</div><div class="n" id="loading-note">This usually takes a few seconds.</div></div></div>
    <div class="bar" id="bar" role="region" aria-label="Save or submit" hidden>
      <span class="btnwrap"><button type="button" id="save">Save for later</button><span class="btn-note">Keeps your work. Open this same link to continue.</span></span>
      <span class="status" id="status" role="status" aria-live="polite"></span>
      <button type="button" id="reload" hidden>Reload</button>
      <span class="btnwrap"><button type="button" class="primary" id="submit">Finalize and Submit</button><span class="btn-note">Puts what you approved on the map.</span></span>
    </div>
    <script type="module" src="/src/confirm.ts"></script>
  </body>
</html>
