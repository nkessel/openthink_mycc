<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <meta name="referrer" content="no-referrer" />
    <title>Review your group · Massachusetts Climate Organization Map</title>
    <!-- Round 4 (Nov 19): open the connection to the map's server while the page loads -->
    <link rel="preconnect" href="https://script.google.com" crossorigin />
    <link rel="preconnect" href="https://script.googleusercontent.com" crossorigin />
    <style>
      /* Shown before the page's own CSS loads (round 5: progress bar + a sketch of the page) */
      body{margin:0;background:#0a0a0f;color:#e5e7eb;font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
      .loading{max-width:760px;margin:0 auto;padding:40px 0 0}
      .loading .t{font-weight:600;font-size:1.15em}.loading .n{color:#a1a8b3;font-size:.95em;min-height:1.5em;margin:2px 0 14px}
      .lbar{height:8px;border-radius:99px;background:#2f2f3c;overflow:hidden}
      #loading-bar{height:100%;width:0;border-radius:99px;background:linear-gradient(90deg,#34d399,#38bdf8);transition:width .3s linear}
      .eta{color:#a1a8b3;font-size:.85em;margin-top:6px;min-height:1.3em}
      .sk{background:#15151c;border:1px solid #2f2f3c;border-radius:12px;padding:16px;margin:16px 0}
      .sk i{display:block;height:12px;border-radius:6px;margin:10px 0;background:linear-gradient(90deg,#1f1f29 25%,#2a2a36 50%,#1f1f29 75%);background-size:200% 100%;animation:sh 1.4s linear infinite}
      @keyframes sh{to{background-position:-200% 0}}
      @media (prefers-reduced-motion:reduce){.sk i{animation:none}}
    </style>
  </head>
  <body>
    <div id="banner" role="region" aria-label="Editing status"></div>
    <div class="wrap" id="app"><div class="loading" role="status" aria-live="polite">
      <div class="t">Loading your group’s page…</div><div class="n" id="loading-note">Connecting to the map…</div>
      <div class="lbar" aria-hidden="true"><div id="loading-bar"></div></div><div class="eta" id="loading-eta">About 14 seconds left</div>
      <div class="sk" aria-hidden="true"><i style="width:30%"></i><i style="width:65%"></i><i style="width:90%"></i><i style="width:80%"></i></div>
      <div class="sk" aria-hidden="true"><i style="width:45%"></i><i style="width:85%"></i><i style="width:60%"></i></div>
      <div class="sk" aria-hidden="true"><i style="width:35%"></i><i style="width:75%"></i></div>
    </div></div>
    <script>
      // Round 7 (Nov 20): the bar plans for 14 s (the page usually takes about 7), so it finishes early, never late.
      (function () {
        var PLAN = 14000, t0 = Date.now(), bar = document.getElementById("loading-bar"), eta = document.getElementById("loading-eta");
        window.__loadingTimer = setInterval(function () {
          var t = Date.now() - t0, left = Math.ceil((PLAN - t) / 1000);
          if (bar) bar.style.width = Math.min(95, (t / PLAN) * 95) + "%";
          if (eta) eta.textContent = left > 1 ? "About " + left + " seconds left" : "Almost done…";
        }, 250);
      })();
    </script>
    <div class="bar" id="bar" role="region" aria-label="Save or submit" hidden>
      <span class="btnwrap"><button type="button" id="save">Save for later</button><span class="btn-note">Saves your work. Open this same link to continue.</span></span>
      <span class="status" id="status" role="status" aria-live="polite"></span>
      <button type="button" id="reload" hidden>Reload</button>
      <span class="btnwrap"><button type="button" class="primary" id="submit">Finalize and Submit</button><span class="btn-note">Puts what you approved on the map.</span></span>
    </div>
    <script type="module" src="/src/confirm.ts"></script>
  </body>
</html>
