name: CI
on:
  pull_request:
  push:
    branches: [development_branch, main]
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run check:apps-script
      - run: npm run test:apps-script
